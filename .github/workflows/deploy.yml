name: Déploiement Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # connexion à Azure par OIDC : aucun mot de passe Azure stocké dans GitHub

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  tests:
    name: Tests .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Naboo.sln -c Release --logger "console;verbosity=normal"

  image:
    name: Image Docker → GitHub Container Registry
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.nom.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Vérifier que l'image est publique (Azure doit pouvoir la télécharger)
        run: |
          depot="${GITHUB_REPOSITORY,,}"
          jeton=$(curl -fsS "https://ghcr.io/token?scope=repository:${depot}:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${jeton}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${depot}/manifests/${GITHUB_SHA::12}")
          if [ "$code" != "200" ]; then
            echo "::error::Le paquet ghcr.io/${depot} est privé. Sur GitHub : ton profil → Packages → naboo-cloud → Package settings → Change visibility → Public, puis relance ce workflow."
            exit 1
          fi

  deploiement:
    name: Infrastructure (Terraform) + site
    needs: image
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_image: ${{ needs.image.outputs.image }}
      TF_VAR_location: ${{ vars.AZURE_REGION || 'francecentral' }}
      TF_VAR_admin_mot_de_passe: ${{ secrets.ADMIN_MOT_DE_PASSE }}
      TF_VAR_email_proprietaire: ${{ vars.EMAIL_PROPRIETAIRE }}
      TF_VAR_icloud_identifiant: ${{ vars.ICLOUD_IDENTIFIANT }}
      TF_VAR_icloud_url_calendrier: ${{ vars.ICLOUD_URL_CALENDRIER }}
      TF_VAR_icloud_mot_de_passe: ${{ secrets.ICLOUD_MOT_DE_PASSE_APP }}
      TF_VAR_smtp_hote: ${{ vars.SMTP_HOTE }}
      TF_VAR_smtp_utilisateur: ${{ vars.SMTP_UTILISATEUR }}
      TF_VAR_smtp_mot_de_passe: ${{ secrets.SMTP_MOT_DE_PASSE }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: >
          terraform -chdir=infra init -input=false
          -backend-config="resource_group_name=rg-naboo-tfstate"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=naboo.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -auto-approve

      - name: Récupérer les adresses
        id: sorties
        run: |
          echo "api=$(terraform -chdir=infra output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "site=$(terraform -chdir=infra output -raw site_url)" >> "$GITHUB_OUTPUT"
          swa=$(terraform -chdir=infra output -raw swa_nom)
          rg=$(terraform -chdir=infra output -raw groupe_ressources)
          jeton=$(az staticwebapp secrets list --name "$swa" --resource-group "$rg" --query properties.apiKey -o tsv)
          echo "::add-mask::$jeton"
          echo "jeton=$jeton" >> "$GITHUB_OUTPUT"

      - name: Écrire l'adresse de l'API dans le site
        run: echo "window.NABOO_API = '${{ steps.sorties.outputs.api }}';" > web/config.js

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.sorties.outputs.jeton }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true

      - name: Test de fumée (l'API répond, la config est servie)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.sorties.outputs.api }}/sante"; then break; fi
            echo "En attente du démarrage de l'API ($i)…"; sleep 15
          done
          curl -fsS "${{ steps.sorties.outputs.api }}/api/config" | jq -e '.ok == true and (.config.prestations | length) > 0'
          echo "### ✅ Déployé" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site : ${{ steps.sorties.outputs.site }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Espace de gestion : ${{ steps.sorties.outputs.site }}/admin.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- API : ${{ steps.sorties.outputs.api }}" >> "$GITHUB_STEP_SUMMARY"
