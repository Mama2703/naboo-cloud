name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main est couvert par le workflow de déploiement

permissions:
  contents: read

jobs:
  tests:
    name: Tests .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Naboo.sln -c Release --logger "console;verbosity=normal"

  terraform:
    name: Terraform (format + validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t naboo-api:ci .
